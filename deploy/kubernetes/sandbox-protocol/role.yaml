# Exactly the verbs the node's `runtime` check asserts of a node that runs
# sandboxes: it creates, reads, lists and deletes its sandbox pods, reads the
# log of one that stopped before connecting, and reads the policies it
# verifies. Nothing on Secrets, no attach.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tracon-node
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get"]
