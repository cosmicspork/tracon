# The node accepts only its own sandboxes, only on the sandbox port: by
# `tracon.dev/node`, its `[boundary] resource_prefix`, as the sandbox policy
# selects them. A second node in the namespace carries a copy named and
# labelled with its own prefix.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tracon-node
spec:
  podSelector:
    matchLabels:
      tracon.dev/role: node
      tracon.dev/node: tracon
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              tracon.dev/role: sandbox
              tracon.dev/node: tracon
      ports:
        - protocol: TCP
          port: 7426
