# The node accepts only its sandboxes, only on the sandbox port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tracon-node
spec:
  podSelector:
    matchLabels:
      tracon.dev/role: node
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              tracon.dev/role: sandbox
      ports:
        - protocol: TCP
          port: 7426
