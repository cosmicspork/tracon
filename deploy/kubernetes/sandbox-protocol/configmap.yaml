apiVersion: v1
kind: ConfigMap
metadata:
  name: tracon-node
data:
  node.toml: |
    node_name = "work"

    [runtime]
    kind = "kubernetes"

    [runtime.kubernetes]
    sandbox_protocol = true

    [gateway]
    # The node's listeners face its pod network; its sandboxes reach them
    # only through their tunnels, which dial the node's loopback.
    harness_listen = "0.0.0.0:7421"

    [session]
    worktree_root = "/state/work"

    [consulta]
    command = "uv"
    args = ["run", "--project", "/opt/consulta", "consulta"]
