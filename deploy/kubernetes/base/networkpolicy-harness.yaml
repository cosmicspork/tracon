# The boundary. A harness pod accepts nothing, and may reach only the node's
# pod, on the forward (MCP), proxy and egress ports. No DNS, no API server, no
# internet: everything else the harness needs goes through the node's
# allowlist proxy, or through the per-client egress proxy on 7424 with
# credentials the node issued to that one run. The node drives every harness
# over its attached stdio, so nothing dials in. The node verifies this
# policy's shape at startup and refuses to run harnesses if it is missing or
# wider. Without 7424 it still runs, and issues no egress grants.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tracon-harness
spec:
  podSelector:
    matchLabels:
      tracon.dev/role: harness
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress:
    - to:
        - podSelector:
            matchLabels:
              tracon.dev/role: node
      ports:
        - protocol: TCP
          port: 7421
        - protocol: TCP
          port: 8888
        - protocol: TCP
          port: 7424
