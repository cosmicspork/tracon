# The boundary of a sandbox pod (`[runtime.kubernetes] sandbox_protocol`):
# it accepts nothing, and may reach only the node's pod, on the sandbox port,
# where it presents its run's one-time token over TLS pinned to the node. No
# DNS, no API server, no internet, and none of the node pod's other ports:
# the MCP and model gateway and both proxies are tunnels over that one
# connection. The node verifies this policy's shape before it runs a
# sandbox. Selects nothing until the node runs sandboxes.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tracon-sandbox
spec:
  podSelector:
    matchLabels:
      tracon.dev/role: sandbox
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress:
    - to:
        - podSelector:
            matchLabels:
              tracon.dev/role: node
      ports:
        - protocol: TCP
          port: 7426
