# The boundary of a sandbox pod: it accepts nothing, and may reach only the node's pod, on the sandbox port,
# where it presents its run's one-time token over TLS pinned to the node. No
# DNS, no API server, no internet, and none of the node pod's other ports:
# the MCP and model gateway and both proxies are tunnels over that one
# connection. The node verifies this policy's shape before it runs a
# sandbox.
#
# Per node: `<prefix>-sandbox` selects that node's sandboxes and lets them
# reach that node's pod alone, both by `tracon.dev/node: <prefix>`. A second
# node in the namespace carries a copy with its own prefix in all three
# places.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tracon-sandbox
spec:
  podSelector:
    matchLabels:
      tracon.dev/role: sandbox
      tracon.dev/node: tracon
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress:
    - to:
        - podSelector:
            matchLabels:
              tracon.dev/role: node
              tracon.dev/node: tracon
      ports:
        - protocol: TCP
          port: 7426
