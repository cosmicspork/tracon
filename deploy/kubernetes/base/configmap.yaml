apiVersion: v1
kind: ConfigMap
metadata:
  name: tracon-node
data:
  # Seeded onto the state volume on first start (see the deployment's
  # seed-config init container); after that the file on the volume is
  # authoritative, because the node writes to it. Edit it there, or delete it
  # to reseed from here.
  node.toml: |
    node_name = "work"

    [runtime]
    kind = "kubernetes"

    [gateway]
    # The node's listeners face its pod network; its sandboxes reach them
    # only through their tunnels, which dial the node's loopback.
    harness_listen = "0.0.0.0:7421"

    [session]
    worktree_root = "/state/work"

    # Sandbox pods run beside the node's own pod unless a pool of nodes is
    # named for them, say one the cluster autoscaler sizes from zero (README,
    # "Sandbox pool"):
    # [runtime.kubernetes.pool]
    # node_selector = { workload = "tracon-sandbox" }
    # tolerations = [{ key = "workload", value = "tracon-sandbox", effect = "NoSchedule" }]
