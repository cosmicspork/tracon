apiVersion: v1
kind: ConfigMap
metadata:
  name: tracon-node
data:
  # Seeded onto the state volume on first start (see the deployment's
  # seed-config init container); after that the file on the volume is
  # authoritative, because the node writes to it. Edit it there, or delete it
  # to reseed from here.
  node.toml: |
    node_name = "work"

    [runtime]
    kind = "kubernetes"

    [gateway]
    # The harness reaches the node by pod IP; loopback would not be reachable.
    harness_listen = "0.0.0.0:7421"

    [session]
    worktree_root = "/state/work"

    [consulta]
    command = "uv"
    args = ["run", "--project", "/opt/consulta", "consulta"]
