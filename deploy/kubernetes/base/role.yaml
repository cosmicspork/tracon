# Exactly the verbs the node's `runtime` check asserts, and no more: it
# creates, watches, attaches to, reads the logs of, and deletes its harness
# pods, and reads the NetworkPolicy it verifies. It cannot edit that policy.
# The secrets rule is the one optional set: a run lent credentials (or an
# egress grant) keeps them in a Secret of its own, `<pod>-env`, rather than
# in its pod spec. Without the rule the node still runs, and refuses those
# runs instead of putting the values in plaintext.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tracon-node
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  # Attach is a GET that upgrades to a WebSocket, which the API server
  # authorises as `get`; `create` covers the POST form. Both, or the node can
  # create a harness it cannot talk to.
  - apiGroups: [""]
    resources: ["pods/attach"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get"]
  # Create before the pod, patch its owner to the pod, delete once the pod
  # has started, list what a node that died left. Nothing reads one back, so
  # no `get`.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "patch", "delete", "list"]
