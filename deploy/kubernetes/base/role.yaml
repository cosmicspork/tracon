# Exactly the verbs the node's `runtime` check asserts, and no more: it
# creates, watches, attaches to, reads the logs of, and deletes its harness
# pods, and reads the NetworkPolicy it verifies. It cannot edit that policy.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tracon-node
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/attach"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get"]
