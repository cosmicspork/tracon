# One volume, ReadWriteOnce, the node's alone: its own state under
# /state/tracon, its worktrees, and every session's files, which travel to
# and from each sandbox pod over the sandbox protocol. No sandbox mounts any
# of it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tracon-state
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
