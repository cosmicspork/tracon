apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracon-node
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      tracon.dev/role: node
  template:
    metadata:
      labels:
        tracon.dev/role: node
    spec:
      serviceAccountName: tracon-node
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Seed the config onto the state volume once. After that the file on
        # the volume is the node's own: `tracon enroll`, Settings and
        # `tracon repo set` write to it, which a ConfigMap mount would refuse.
        # Delete it to reseed from the ConfigMap.
        - name: seed-config
          image: ghcr.io/cosmicspork/tracon-node:latest
          command:
            - sh
            - -c
            - mkdir -p /state/config/tracon && [ -f /state/config/tracon/node.toml ] || cp /seed/node.toml /state/config/tracon/node.toml
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: state
              mountPath: /state
            - name: seed
              mountPath: /seed
              readOnly: true
      containers:
        - name: node
          image: ghcr.io/cosmicspork/tracon-node:latest
          args: ["serve"]
          env:
            - name: XDG_CONFIG_HOME
              value: /state/config
            - name: XDG_STATE_HOME
              value: /state
            - name: HOME
              value: /state/home
            - name: RUST_LOG
              value: tracon=info
            # A Deployment's pod is started again whenever its process exits,
            # so a restart asked for through the API is a clean exit.
            - name: TRACON_RESTART_BY_EXIT
              value: "1"
            - name: TRACON_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: TRACON_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: TRACON_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: forward
              containerPort: 7421
            - name: proxy
              containerPort: 8888
            - name: egress
              containerPort: 7424
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: state
              mountPath: /state
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: tracon-state
        - name: seed
          configMap:
            name: tracon-node
