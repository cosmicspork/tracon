# Its own workspace, deliberately: building this needs webkit2gtk and gtk
# development headers, and the node and hub must stay buildable on a machine
# that has neither. `cargo test` at the repo root never reaches here.
#
# The root manifest excludes `wrapper`, which settles it for a plain checkout.
# It does not settle it for a git worktree made under the repo, where this path
# is not the excluded one and cargo adopts the workspace above instead. Saying
# it here makes the wrapper its own root wherever it is checked out.
[workspace]

[package]
name = "tracon-wrapper"
version = "0.16.2"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/cosmicspork/tracon"
description = "Tray client for a tracon node that is already running"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "fs", "io-util", "net", "process"] }
futures-util = "0.3"
semver = "1"
sha2 = "0.10"
parking_lot = "0.12"
libc = "0.2"

[profile.release]
strip = true
