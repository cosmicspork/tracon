<!-- The Linux app icon: the brand mark on a rounded tile, inset from the edge
     the way Plasma's other app icons are. A Linux desktop shows the PNGs as
     given, so a full-bleed square reads as a flat block. macOS masks its own
     icon shape, so icon.icns keeps the full-bleed art and is not built here.
     Render: rsvg-convert -w 32 -h 32 icon.svg -o 32x32.png
             rsvg-convert -w 128 -h 128 icon.svg -o 128x128.png
             rsvg-convert -w 256 -h 256 icon.svg -o 128x128@2x.png
             rsvg-convert -w 512 -h 512 icon.svg -o icon.png -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect x="50" y="50" width="412" height="412" rx="92" fill="#141517" />
  <!-- A faint rim keeps the tile's edge visible on a dark panel. -->
  <rect x="52" y="52" width="408" height="408" rx="90" fill="none" stroke="#7fa6c9" stroke-opacity="0.25" stroke-width="4" />
  <g transform="translate(256 256) scale(15) translate(-12 -12)">
    <g fill="none" stroke="#7fa6c9" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9" />
      <path d="M12 12l6-6" />
    </g>
    <circle cx="12" cy="12" r="1.4" fill="#7fa6c9" />
  </g>
</svg>
