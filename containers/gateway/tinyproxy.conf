Port 8888
# Listen is set by the entrypoint to the internal gateway IP, so the CONNECT
# proxy is offered only on the internal network — never on the default network
# the gateway also joins. This placeholder is overridden at start.
Listen 127.0.0.1
Timeout 60
Allow 10.89.0.0/24
ConnectPort 443
Filter "/etc/tinyproxy/allow.txt"
FilterDefaultDeny Yes
FilterExtended On
LogLevel Connect
