[package]
name = "tracon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Personal agent orchestration node: supervises harnesses, enforces the gate, serves the interface."

[lib]
name = "tracon"
path = "src/lib.rs"

[[bin]]
name = "tracon"
path = "src/main.rs"

# Test-only ACP agent. Declared as a bin so cargo builds it and hands
# `CARGO_BIN_EXE_fake_agent` to the integration tests. It lives under
# tests/support/ so cargo does not also treat it as a test target.
[[bin]]
name = "fake_agent"
path = "tests/support/fake_agent.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
clap.workspace = true
dirs.workspace = true
futures-core = "0.3.34"
mime_guess.workspace = true
rand = "0.9"
rusqlite.workspace = true
rust-embed.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlparser = "0.59"
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true
toml.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
