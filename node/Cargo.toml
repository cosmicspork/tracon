[package]
name = "tracon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Personal agent orchestration node: supervises harnesses, enforces the gate, serves the interface."

[lib]
name = "tracon"
path = "src/lib.rs"

[[bin]]
name = "tracon"
path = "src/main.rs"

# Test-only ACP agent. Declared as a bin so cargo builds it and hands
# `CARGO_BIN_EXE_fake_agent` to the integration tests. It lives under
# tests/support/ so cargo does not also treat it as a test target.
[[bin]]
name = "fake_agent"
path = "tests/support/fake_agent.rs"

[dependencies]
anyhow.workspace = true
tracon-proto.workspace = true
tracon-sync.workspace = true
async-trait.workspace = true
axum.workspace = true
clap.workspace = true
dirs.workspace = true
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = "2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
futures-core = "0.3.34"
hex.workspace = true
sha2.workspace = true
mime_guess.workspace = true
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
kube = { version = "4", default-features = false, features = ["client", "rustls-tls", "ws"] }
k8s-openapi = { version = "0.28", features = ["v1_33"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
regex = "1"
futures-util = { version = "0.3", default-features = false }
base64.workspace = true
rusqlite.workspace = true
rust-embed.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlparser = "0.59"
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true
toml.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
tracon-hub = { path = "../hub" }
tower = { version = "0.5.3", features = ["util"] }
