# The five working agreements, as rules the node enforces rather than prose an
# agent is asked to remember.
#
# Denials are deliberate and explained: the agent reads the reason and stops,
# instead of meeting a confusing auth error and looking for another way round.
# Anything not matched here is asked, so adding a rule can only ever reduce the
# number of interruptions, never widen what an agent may do unattended.

version = 11

# --- 1. Worktree, not the main checkout -------------------------------------
# Structurally true already: the harness only ever sees its own worktree at
# /work. The rule exists so an attempt to reach outside it is refused with a
# reason rather than failing as a missing path.
#
# What is named here is the *shape* of leaving the worktree — pointing git at
# another repository, or changing into a home directory — and never one
# installation's directory layout. A rule that hard-codes where a particular
# operator keeps their checkouts protects nobody else's, and ships that
# operator's filesystem in a signed bundle everyone receives.

[[rule]]
id = "worktree-only"
verdict = "deny"
reason = "Sessions work in their own worktree at /work. Another checkout may hold work that is not yours."
matches = [
    "git -c ",
    "git --git-dir",
    "git --work-tree",
    "cd ~",
    "cd $home",
    "cd /home/",
    "cd /users/",
    "cd /root",
]

# The harness's own configuration is the node's to write, not the session's.
# Claude Code reads `.claude/settings.json` from the worktree (a session whose
# repository carries one is refused at launch), and a settings file written
# mid-session could allow tools without asking or add a hook that runs commands.
# Git's internals are not the work either: a hook or a config change there runs
# on whoever next commits in that tree. Matched as substrings so a relative
# path, an absolute one and a shell line naming it are all caught.

[[rule]]
id = "harness-settings"
verdict = "deny"
reason = "The harness's settings are the node's, not the session's: a settings file could allow tools without asking. Change the work, not the harness."
matches = [".claude/settings"]

[[rule]]
id = "git-internals"
verdict = "deny"
reason = "Git's internals are not the work: a hook or config written there runs on whoever commits next. Change tracked files and commit them."
kinds = ["write"]
matches = [".git/"]

# --- 2. Review before publish ------------------------------------------------
# The agent holds no forge token, so these would fail anyway. Denying them makes
# the refusal legible and points at the tool that does work.

[[rule]]
id = "review-before-publish"
verdict = "deny"
reason = "Publishing goes through review. Commit, then call submit_review; the node publishes what a human approves."
matches = [
    "gh pr create",
    "glab mr create",
    "git push",
    "gh release create",
]

# --- 3. No merge -------------------------------------------------------------

[[rule]]
id = "no-merge"
verdict = "deny"
reason = "Opening the change is yours; merging it is the operator's."
matches = ["gh pr merge", "glab mr merge", "git merge --no-ff main", "gh pr ready"]

# --- 4. No transition --------------------------------------------------------

[[rule]]
id = "no-transition"
verdict = "deny"
reason = "Moving a ticket's status desyncs what the operator is actually working on. Comment instead."
matches = ["jira workitem transition", "acli jira workitem transition"]

# --- 5. No production deploy -------------------------------------------------

[[rule]]
id = "no-production-deploy"
verdict = "deny"
reason = "Production pipelines are run by hand. A signed policy change is required before a local grant can authorize one."
matches = [
    "environment:production",
    "environment=production",
    "-prd",
    "eks-prd",
    "--context=prd",
    "kubectl apply",
]

# --- Reading is free ---------------------------------------------------------
# Inspection changes nothing and asking about it trains the operator to approve
# without reading, which is how a gate stops being one.

[[rule]]
id = "read-only-git"
verdict = "allow"
reason = "Inspecting the repository changes nothing."
kinds = ["execute"]
matches = [
    "git status",
    "git diff",
    "git log",
    "git show",
    "git branch --list",
    "git rev-parse",
    "git ls-files",
    "git remote -v",
]

# Leading-token match: the command must *start* with one of these. A chain
# joined by `|`, `&&`, `||` or `;` is allowed only when every command in it is
# allowed on its own; a redirection, substitution or variable is asked.
[[rule]]
id = "read-only-shell"
verdict = "allow"
reason = "Reading the worktree changes nothing."
kinds = ["execute"]
matches = ["ls", "cat", "head", "tail", "wc", "file", "pwd", "which", "grep"]

[[rule]]
id = "reads-and-thoughts"
verdict = "allow"
reason = "Reading a file or updating the plan changes nothing outside the session."
kinds = ["read", "think"]

# --- Editing the work --------------------------------------------------------
# An edit inside the session's own worktree reaches nothing until the operator
# approves the diff at review, which is where an edit is actually judged. Asking
# about each one first was most of the queue on a real implementation session
# (46 of 50 asks) and taught the operator to approve without reading. Edits to
# the harness's settings and to Git's internals are refused above whatever
# this says, and a path that climbs out of /work is not under it.

[[rule]]
id = "worktree-edits"
verdict = "allow"
reason = "An edit in the session's own worktree reaches nothing until the operator approves the diff at review."
kinds = ["write"]
matches = ["/work/"]

# --- Brokered tools ----------------------------------------------------------
# What the node does on the agent's behalf is decided here too, before the
# broker is touched. A tool is allowed by name; one not named is asked. The
# merge, transition, and deploy tools also require narrow authority grants.
# A grant never overrides a signed policy denial.

[[rule]]
id = "brokered-reads"
verdict = "allow"
reason = "A read-only query or lookup, a search, a pipeline or check read, or a report/review submission that only enters the operator queue changes nothing the operator has not agreed to."
kinds = ["tool"]
matches = [
    "query",
    "describe",
    "submit_review",
    "review_status",
    "submit_report",
    "report_status",
    "review_verdict",
    "mr_status",
    "mr_discussions",
    "mr_for_branch",
    "pipeline_status",
    "job_trace",
    "pr_status",
    "pr_threads",
    "pr_for_branch",
    "run_status",
    "issue",
    "issue_search",
]

# Writing to the forge or the tracker — a comment, an edited field, a new
# issue, a pipeline run — is named nowhere here, so every one of them is asked. A comment is
# visible, attributable and reversible, which is why it is what the agent does
# instead of transitioning a ticket; it is still the agent speaking in the
# operator's name where colleagues will read it, and one look before it lands
# costs less than the retraction.

# Memory and documents are the node's own corpus. Reading it is free; what
# the agent retains is bounded by kind (a lesson waits for the nightly batch)
# rather than by asking every time. Writing a document is asked — a document
# is the operator's artifact — except the working notes below.
[[rule]]
id = "corpus-and-ledger"
verdict = "allow"
reason = "Recalling what is known, reading a document or a brief, retaining a fact, or recording and closing work changes nothing the operator has not agreed to."
kinds = ["tool"]
matches = [
    "recall",
    "retain",
    "doc_read",
    "doc_search",
    "brief_read",
    "criteria_read",
    "work_ready",
    "work_discover",
    "work_close",
]

# A brief line is not a working note: `brief_note` is named nowhere here, so
# every line a session would add to a brief is put to the operator first. The
# node already refuses a session's decision and a session's uncited
# observation; what is left is a claim about the customer, in the operator's
# own record of what the work is for, and one look before it lands costs less
# than finding it there later.
#
# `criteria_link` is a brief line too — an agent's proposal about what would
# settle a criterion, written into the operator's own record of what the work is
# for — so it is named nowhere here either, and is asked the same way. There is
# no tool for judging a criterion at all: that one is not asked, it is absent.

# Working notes are the agent's to keep current. A plan, a guide, a proposal or
# a reference is not, and stays asked. A document's kind is its slug's prefix,
# so the allow is scoped by that.
[[rule]]
id = "unattended-notes"
verdict = "allow"
reason = "Keeping working notes current changes nothing the operator has not agreed to; plans, guides and references are asked."
kinds = ["tool"]
matches = ["doc_write"]
args = { slug = ["note-*", "repo-*", "meeting-*", "inbox-*"] }
