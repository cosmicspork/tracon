# The working agreements, as rules the node enforces rather than prose an
# agent is asked to remember.
#
# The boundary does the containing. A session runs unprivileged in its own
# container, with no route out but the egress it is granted, no credential the
# node did not lend it for one call, and nothing it makes reaching anyone until
# the operator approves the diff at review. Inside that, a shell command, an
# edit or a read is the session's own business: asking about each one put
# dozens of cards in front of the operator on every real session, nearly all of
# them for work that could not leave the container, and taught them to approve
# without reading. So reads, writes and shell commands run unattended, and
# this bundle is about what crosses the boundary or speaks in the operator's
# name: publishing, merging, moving a ticket, the harness's own
# configuration, and every brokered tool that writes somewhere others will
# read.
#
# Denials are deliberate and explained: the agent reads the reason and stops,
# instead of meeting a confusing auth error and looking for another way round.
# A denial wins over any allow, whatever the order. An action no rule names —
# a brokered write, a tool whose kind the node does not know — is asked.

version = 15

# --- 1. The harness and Git's internals stay the node's ---------------------
# The harness's own configuration is the node's to write, not the session's.
# Claude Code reads `.claude/settings.json` from the worktree (a session whose
# repository carries one is refused at launch), and a settings file written
# mid-session could allow tools without asking or add a hook that runs commands.
# It is also the one edit that would leave the boundary through the diff: a
# settings file committed to the branch configures the harness of whoever
# checks it out. Git's internals are not the work either: a hook or a config
# change there runs on whoever next commits in that tree. The settings rule is
# matched as a substring so a relative path, an absolute one and a shell line
# naming it are all caught; the Git rule covers the edit tools, and a shell
# line that writes under `.git/` meets a node that reads every candidate with
# hooks off and replace refs ignored.

[[rule]]
id = "harness-settings"
verdict = "deny"
reason = "The harness's settings are the node's, not the session's: a settings file could allow tools without asking. Change the work, not the harness."
matches = [".claude/settings"]

[[rule]]
id = "git-internals"
verdict = "deny"
reason = "Git's internals are not the work: a hook or config written there runs on whoever commits next. Change tracked files and commit them."
kinds = ["write"]
matches = [".git/"]

# --- 2. Review before publish ------------------------------------------------
# The agent holds no forge token, so these would fail anyway. Denying them makes
# the refusal legible and points at the tool that does work.

[[rule]]
id = "review-before-publish"
verdict = "deny"
reason = "Publishing goes through review. Commit, then call submit_review; the node publishes what a human approves."
matches = [
    "gh pr create",
    "glab mr create",
    "git push",
    "gh release create",
]

# --- 3. No merge -------------------------------------------------------------

[[rule]]
id = "no-merge"
verdict = "deny"
reason = "Opening the change is yours; merging it is the operator's."
matches = ["gh pr merge", "glab mr merge", "git merge --no-ff main", "gh pr ready"]

# --- 4. No transition --------------------------------------------------------

[[rule]]
id = "no-transition"
verdict = "deny"
reason = "Moving a ticket's status desyncs what the operator is actually working on. Comment instead."
matches = ["jira workitem transition", "acli jira workitem transition"]

# --- Inside the boundary -----------------------------------------------------
# Reading, editing and running commands in the session's own container. What a
# command could reach outside it is decided by the egress the session holds,
# not by guessing from its text; what an edit could change for anyone else is
# decided at review, where the diff is read. The denials above still see every
# line and every path first, so `git push` or a settings file is refused here
# as anywhere.

[[rule]]
id = "reads-and-thoughts"
verdict = "allow"
reason = "Reading a file or updating the plan changes nothing outside the session."
kinds = ["read", "think"]

[[rule]]
id = "boundary-shell"
verdict = "allow"
reason = "A command runs inside the session's boundary: no route out but its granted egress, no credentials, and nothing it makes is published until the operator approves it at review."
kinds = ["execute"]

[[rule]]
id = "boundary-writes"
verdict = "allow"
reason = "An edit inside the session's boundary reaches nothing until the operator approves the diff at review."
kinds = ["write"]

# --- Brokered tools ----------------------------------------------------------
# What the node does on the agent's behalf is decided here too, before the
# broker is touched. A tool is allowed by name; one not named is asked. The
# merge, transition, and deploy tools also require narrow authority grants.
# A grant never overrides a signed policy denial.

[[rule]]
id = "brokered-reads"
verdict = "allow"
reason = "A read-only query or lookup, a search, a pipeline or check read, or a report/review submission that only enters the operator queue changes nothing the operator has not agreed to."
kinds = ["tool"]
matches = [
    "query",
    "describe",
    "submit_review",
    "review_status",
    "submit_report",
    "report_status",
    "review_verdict",
    "mr_status",
    "mr_discussions",
    "mr_for_branch",
    "pipeline_status",
    "job_trace",
    "pr_status",
    "pr_threads",
    "pr_for_branch",
    "run_status",
    "issue",
    "issue_search",
    "issue_transitions",
]

# Writing to the forge or the tracker — a comment, an edited field, a new
# issue, a pipeline run — is named nowhere here, so every one of them is asked. A comment is
# visible, attributable and reversible, which is why it is what the agent does
# instead of transitioning a ticket; it is still the agent speaking in the
# operator's name where colleagues will read it, and one look before it lands
# costs less than the retraction.

# Memory and documents are the node's own corpus. Reading it is free; what
# the agent retains is bounded by kind (a lesson waits for the nightly batch)
# rather than by asking every time. Writing a document is asked — a document
# is the operator's artifact — except the working notes below.
[[rule]]
id = "corpus-and-ledger"
verdict = "allow"
reason = "Recalling what is known, reading a document or a brief, retaining a fact, or recording and closing work changes nothing the operator has not agreed to."
kinds = ["tool"]
matches = [
    "recall",
    "retain",
    "doc_read",
    "doc_search",
    "brief_read",
    "criteria_read",
    "work_ready",
    "work_discover",
    "work_close",
]

# A brief line is not a working note: `brief_note` is named nowhere here, so
# every line a session would add to a brief is put to the operator first. The
# node already refuses a session's decision and a session's uncited
# observation; what is left is a claim about the customer, in the operator's
# own record of what the work is for, and one look before it lands costs less
# than finding it there later.
#
# `criteria_link` is a brief line too — an agent's proposal about what would
# settle a criterion, written into the operator's own record of what the work is
# for — so it is named nowhere here either, and is asked the same way. There is
# no tool for judging a criterion at all: that one is not asked, it is absent.

# Working notes are the agent's to keep current. A plan, a guide, a proposal or
# a reference is not, and stays asked. A document's kind is its slug's prefix,
# so the allow is scoped by that.
[[rule]]
id = "unattended-notes"
verdict = "allow"
reason = "Keeping working notes current changes nothing the operator has not agreed to; plans, guides and references are asked."
kinds = ["tool"]
matches = ["doc_write"]
args = { slug = ["note-*", "repo-*", "meeting-*", "inbox-*"] }

# A catalogue service is the operator's image, run beside the session in its
# network and nowhere else, so the service itself is the authority, by name. A
# headless browser reaches only what the session already does and runs
# unattended; anything else in the catalogue (a database, a cache) is asked
# until a rule names it. Asking whether a service is ready changes nothing.
[[rule]]
id = "unattended-browser"
verdict = "allow"
reason = "A headless browser beside the session reaches only what the session already can."
kinds = ["tool"]
matches = ["service_start"]
args = { name = ["browser"] }

[[rule]]
id = "service-status"
verdict = "allow"
reason = "Reading whether a service is ready changes nothing."
kinds = ["tool"]
matches = ["service_status"]
