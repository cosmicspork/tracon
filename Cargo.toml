[workspace]
resolver = "2"
members = ["proto", "node", "hub"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/cosmicspork/tracon"

[workspace.dependencies]
tracon-proto = { path = "proto" }
base64 = "0.22"
hex = "0.4"
sha2 = "0.10"
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["json", "macros"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
mime_guess = "2"
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
rust-embed = { version = "8", features = ["include-exclude"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "signal", "fs", "net"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["codec"] }
toml = "0.9"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v7"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
