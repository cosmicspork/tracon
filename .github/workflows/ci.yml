name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: spa
      - run: bun run check
        working-directory: spa
      - run: bun test
        working-directory: spa
      - run: bun run build
        working-directory: spa

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # No SPA build here on purpose: build.rs writes a placeholder so the Rust
      # job never depends on the JS toolchain.
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # A node runs on hosts whose glibc is not ours to control, so the Linux
  # artefact has to be static. Built on every change rather than at release, so
  # a dependency that cannot cross-compile is caught by the PR that adds it.
  musl:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: mlugg/setup-zig@v2
      - run: cargo install cargo-zigbuild --locked
      - run: cargo zigbuild --release --target ${{ matrix.target }}
      - name: assert the binary is actually static
        run: |
          file target/${{ matrix.target }}/release/tracon
          file target/${{ matrix.target }}/release/tracon | grep -q "statically linked"
