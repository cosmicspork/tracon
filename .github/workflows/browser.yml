name: browser

# The `browser` catalogue service's bundle, which a sandbox's supervisor runs:
# assembled and smoke-tested on the stock base's own base image for both
# architectures, each on its own kind of runner (Chrome does not run under
# emulation), on every PR that touches it (Dependabot's upstream bumps
# included). Releases attach it (release.yml); here it is only checked.
on:
  pull_request:
    paths:
      - containers/browser/**
      - scripts/browser-bundle.sh
      - containers/sandbox-base/Containerfile
      - .github/workflows/browser.yml
  push:
    branches: [main]
    paths:
      - containers/browser/**
      - scripts/browser-bundle.sh
      - containers/sandbox-base/Containerfile
      - .github/workflows/browser.yml
  # Check again on demand.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-24.04
          - arch: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The arm64 runner image may come without it.
      - name: Podman
        run: command -v podman || { sudo apt-get update && sudo apt-get install -y podman; }

      - name: Assemble
        run: scripts/browser-bundle.sh --arch ${{ matrix.arch }} --out services

      - name: Smoke test on the base's base image
        run: containers/browser/bundle-smoke.sh services/*/${{ matrix.arch }}
