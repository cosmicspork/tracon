name: release

on:
  push:
    branches: [main]
  # Re-run the artefact jobs for a release that already exists, when an
  # upload failed part way. Nothing here re-tags.
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing release tag, e.g. v0.6.0"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  # Opens/updates a release PR from the conventional-commit history; merging it
  # tags the release and sets release_created=true. On a manual re-run the
  # named tag is treated as the release to attach artefacts to.
  release-please:
    runs-on: ubuntu-24.04
    # Two merges landing seconds apart each saw no open release PR and opened
    # one, then raced to push the lockfile commit (#476/#477). Pushes to main
    # take this job one at a time. The workflow itself still has no group: it
    # would let a later merge drop a queued release's artefact jobs. Here a
    # dropped pending run costs nothing, because the run that replaces it reads
    # the same history and still tags a merged release PR. A manual re-run gets
    # a group of its own so a push never displaces it.
    concurrency:
      group: ${{ github.event_name == 'push' && 'release-please' || format('release-please-dispatch-{0}', github.run_id) }}
      cancel-in-progress: false
    outputs:
      release_created: ${{ steps.out.outputs.release_created }}
      version: ${{ steps.out.outputs.version }}
      tag: ${{ steps.out.outputs.tag }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        if: github.event_name == 'push'
        id: rp
        with:
          # A PR opened with GITHUB_TOKEN gets no CI run until someone approves
          # it by hand, and the release PR has required checks. This token opens
          # it as a user instead. Without the secret it falls back to
          # GITHUB_TOKEN and the old behaviour.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - id: out
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
            echo "release_created=true" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          else
            echo "release_created=${{ steps.rp.outputs.release_created }}" >> "$GITHUB_OUTPUT"
            echo "tag=${{ steps.rp.outputs.tag_name }}" >> "$GITHUB_OUTPUT"
            echo "version=${{ steps.rp.outputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      # release-please bumps the versions but cannot touch a Cargo.lock, so
      # the release PR would fail CI on the stale lockfiles. Refresh both
      # workspaces here. The push goes to the release branch and this workflow
      # runs only on main, so this cannot loop.
      - name: Check out the release PR branch
        if: steps.rp.outputs.prs_created == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJson(steps.rp.outputs.pr).headBranchName }}
          # The release commit and the main commit under it, for the rebuild
          # below.
          fetch-depth: 2
          # Same token as release-please, so the lockfile push below re-runs CI
          # on the commit the release PR will actually merge.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
      # release-please commits each version-bumped file as it read it, on top of
      # the newest main. A merge landing seconds earlier can be in that tree but
      # not in the read, and its edits to the file are silently reverted (#644's
      # zbus dependency vanished from the 0.38.0 PR). Rebuild each file from the
      # main commit under the release commit, changing only its version line.
      - name: Rebuild the version-bumped files from main
        if: steps.rp.outputs.prs_created == 'true'
        run: |
          old=$(git show HEAD^:.release-please-manifest.json | jq -r '."."')
          new=$(jq -r '."."' .release-please-manifest.json)
          old_re=${old//./\\.}
          jq -r '.packages."."."extra-files"[] | "\(.type) \(.path)"' release-please-config.json |
            while read -r type path; do
              case "$type" in
                toml) script="0,/^version = \"$old_re\"\$/s//version = \"$new\"/" ;;
                json) script="0,/^\( *\)\"version\": \"$old_re\"/s//\1\"version\": \"$new\"/" ;;
                *) echo "::error::No rebuild rule for $type file $path"; exit 1 ;;
              esac
              git show "HEAD^:$path" | sed "$script" > "$path.rebuilt"
              if git show "HEAD^:$path" | cmp -s - "$path.rebuilt"; then
                echo "::error::$path has no version line for $old"; exit 1
              fi
              mv "$path.rebuilt" "$path"
              if ! git diff --quiet -- "$path"; then
                echo "::warning::$path was bumped from a stale copy; rebuilt it from main"
              fi
            done
      - name: Install Rust
        if: steps.rp.outputs.prs_created == 'true'
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Refresh the lockfiles
        if: steps.rp.outputs.prs_created == 'true'
        run: |
          cargo update --workspace
          cargo update --workspace --manifest-path wrapper/Cargo.toml
      - name: Commit and push the rebuilt files and refreshed lockfiles
        if: steps.rp.outputs.prs_created == 'true'
        run: |
          files="Cargo.lock wrapper/Cargo.lock $(jq -r '.packages."."."extra-files"[].path' release-please-config.json)"
          if [ -n "$(git status --porcelain $files)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add $files
            git commit -m "chore: refresh lockfiles for release"
            git push origin HEAD:${{ fromJson(steps.rp.outputs.pr).headBranchName }}
          fi

  # The images: the hub, the node for pod-hosted nodes, and the harnesses that
  # those nodes' pods pull. Laptops build the harness locally from the embedded
  # Containerfile instead.
  image:
    # The native harness image installs this release's own tracon-agent, so
    # the binaries go up first.
    needs: [release-please, binaries]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      # One image failing must not cancel the others: the hub and node images
      # are what deployed nodes update from.
      fail-fast: false
      matrix:
        include:
          - name: tracon-hub
            file: Dockerfile
            context: .
          - name: tracon-node
            file: Dockerfile.node
            context: .
          # The harness Containerfiles copy paths relative to their own
          # directory, as the justfile and `tracon setup` build them.
          - name: tracon-harness-claude
            file: containers/harness-claude/Containerfile
            context: containers/harness-claude
          - name: tracon-harness-native
            file: containers/harness-native/Containerfile
            context: containers/harness-native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      # The asset this run attested, staged where the Containerfile prefers it
      # to a download, and checked against its own checksum first.
      - name: Stage this release's tracon-agent for the native harness image
        if: matrix.name == 'tracon-harness-native'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd containers/harness-native/local
          gh release download "${{ needs.release-please.outputs.tag }}" \
            --pattern 'tracon-agent-x86_64-unknown-linux-musl*'
          shasum -a 256 -c tracon-agent-x86_64-unknown-linux-musl.sha256
          mv tracon-agent-x86_64-unknown-linux-musl tracon-agent
          rm tracon-agent-x86_64-unknown-linux-musl.sha256
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/cosmicspork/${{ matrix.name }}:${{ needs.release-please.outputs.version }}
            ghcr.io/cosmicspork/${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # The binaries with the SPA embedded, attached to the release. This is what
  # install.sh fetches: a static Linux x86_64 node and hub, and a native
  # Apple Silicon node. `tracon-agent` is the native harness's binary, for
  # both architectures a node's Podman runs (an Apple Silicon Mac's machine
  # is arm64); its image fetches it from here.
  binaries:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            bins: --bin tracon --bin tracon-hub --bin tracon-agent
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            bins: --bin tracon-agent
          - target: aarch64-apple-darwin
            os: macos-15
            bins: --bin tracon
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Build the SPA
        working-directory: spa
        run: |
          bun install --frozen-lockfile
          bun run build
      - if: runner.os == 'Linux'
        run: |
          grep -rl dl.google.com /etc/apt/sources.list.d /etc/apt/sources.list 2>/dev/null | xargs -r sudo rm -f
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }} ${{ matrix.bins }}
      - name: Assert Linux binaries are static
        if: runner.os == 'Linux'
        run: |
          for b in $(echo "${{ matrix.bins }}" | sed 's/--bin //g'); do
            file target/${{ matrix.target }}/release/$b | grep -qE "statically linked|static-pie linked"
          done
      - name: Assert the macOS binary links only system libraries
        if: runner.os == 'macOS'
        run: |
          otool -L target/${{ matrix.target }}/release/tracon
          ! otool -L target/${{ matrix.target }}/release/tracon | grep -vE '^(target/|[[:space:]]+/usr/lib/|[[:space:]]+/System/)'
      - name: Name and checksum
        run: |
          for b in $(echo "${{ matrix.bins }}" | sed 's/--bin //g'); do
            cp target/${{ matrix.target }}/release/$b $b-${{ matrix.target }}
            shasum -a 256 $b-${{ matrix.target }} > $b-${{ matrix.target }}.sha256
          done
      - name: Attest release binaries
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            *-${{ matrix.target }}
            *-${{ matrix.target }}.sha256
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag }}" *-${{ matrix.target }} *-${{ matrix.target }}.sha256 --clobber

  # The desktop app, with the node carried inside it as a sidecar so a single
  # download is a working install. The macOS bundle is unsigned beyond the
  # ad-hoc signature Apple Silicon needs to execute; every desktop asset
  # carries GitHub build provenance, which is what authenticates the publisher.
  gui:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    strategy:
      # The two legs are independent artefacts: one failing must not cancel
      # the other.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage
          - os: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - if: runner.os == 'Linux'
        run: |
          grep -rl dl.google.com /etc/apt/sources.list.d /etc/apt/sources.list 2>/dev/null | xargs -r sudo rm -f
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libfuse2 patchelf
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Build the SPA
        working-directory: spa
        run: |
          bun install --frozen-lockfile
          bun run build
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
          workspaces: |
            .
            wrapper
      # The sidecar is the same node the standalone binary is; Tauri names it
      # by the wrapper's own target triple.
      - name: Build the node for the sidecar
        run: |
          cargo build --release --bin tracon
          mkdir -p wrapper/binaries
          cp target/release/tracon wrapper/binaries/tracon-${{ matrix.target }}
      # Desktop self-update must not depend on a host-installed CLI. Package
      # GitHub's verifier as a resource, with its official release digest.
      - name: Bundle pinned provenance verifier
        env:
          GH_VERSION: 2.100.0
          GH_LINUX_AMD64_SHA256: e4d4bb4498e8d007abe545b6568926793ace1b6447da598294a610018cb164be
          GH_MACOS_ARM64_SHA256: 45f9a62da2f6e641a7fad57e2ce39656dfd7ef331372d80a2a2aed65abb01642
        run: |
          set -eu
          case "$RUNNER_OS" in
            Linux) platform=linux_amd64; archive=tar.gz; digest="$GH_LINUX_AMD64_SHA256" ;;
            macOS) platform=macOS_arm64; archive=zip; digest="$GH_MACOS_ARM64_SHA256" ;;
            *) echo "unsupported runner $RUNNER_OS" >&2; exit 1 ;;
          esac
          download="gh_${GH_VERSION}_${platform}.${archive}"
          curl -fsSL -o "$RUNNER_TEMP/$download" \
            "https://github.com/cli/cli/releases/download/v${GH_VERSION}/$download"
          echo "$digest  $RUNNER_TEMP/$download" | shasum -a 256 -c -
          case "$archive" in
            tar.gz) tar -xzf "$RUNNER_TEMP/$download" -C "$RUNNER_TEMP" ;;
            zip) unzip -q "$RUNNER_TEMP/$download" -d "$RUNNER_TEMP" ;;
          esac
          install -m 0755 "$RUNNER_TEMP/gh_${GH_VERSION}_${platform}/bin/gh" wrapper/binaries/gh
      - name: Bundle macOS app
        if: runner.os == 'macOS'
        working-directory: wrapper
        run: bunx @tauri-apps/cli@2.11.4 build --bundles ${{ matrix.bundles }} --config '{"bundle":{"externalBin":["binaries/tracon"],"resources":{"binaries/gh":"verifier/gh"}}}'
      - name: Bundle Linux desktop app
        if: runner.os == 'Linux'
        working-directory: wrapper
        run: bunx @tauri-apps/cli@2.11.4 build --bundles ${{ matrix.bundles }} --config '{"bundle":{"externalBin":["binaries/tracon"],"resources":{"binaries/gh":"verifier/gh"}}}'
      # What the app updates itself with. The dmg is the first install — it
      # is what a browser can hand a person — but a mounted image is a poor
      # update unit, and the bundle inside it is what actually gets swapped.
      - name: Archive the bundle for self-update
        if: runner.os == 'macOS'
        working-directory: wrapper/target/release/bundle/macos
        run: |
          version="${{ needs.release-please.outputs.tag }}"
          tar --no-xattrs --no-mac-metadata \
            -czf "tracon_${version#v}_aarch64.app.tar.gz" tracon.app
      - name: Attest Linux desktop asset
        if: runner.os == 'Linux'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest_linux
        with:
          subject-path: wrapper/target/release/bundle/**/*.AppImage
      - name: Attest macOS desktop assets
        if: runner.os == 'macOS'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest_macos
        with:
          subject-path: |
            wrapper/target/release/bundle/**/*.dmg
            wrapper/target/release/bundle/**/*.app.tar.gz
      - name: Publish Linux provenance bundle
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ needs.release-please.outputs.tag }}"
          bundle="tracon_${tag#v}_amd64.AppImage.intoto.jsonl"
          cp "${{ steps.attest_linux.outputs.bundle-path }}" "$bundle"
          gh release upload "$tag" "$bundle" --clobber
      - name: Publish macOS provenance bundle
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ needs.release-please.outputs.tag }}"
          bundle="tracon_${tag#v}_aarch64.provenance.jsonl"
          cp "${{ steps.attest_macos.outputs.bundle-path }}" "$bundle"
          gh release upload "$tag" "$bundle" --clobber
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -R wrapper/target/release/bundle
          gh release upload "${{ needs.release-please.outputs.tag }}" \
            $(find wrapper/target/release/bundle -type f \( -name '*.AppImage' -o -name '*.dmg' -o -name '*.app.tar.gz' \)) --clobber

  # One checksums.txt for install.sh, after every binary is attached.
  checksums:
    needs: [release-please, binaries]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Assemble checksums.txt
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${{ needs.release-please.outputs.tag }}"
          gh release download "$tag" --pattern '*.sha256'
          cat *.sha256 > checksums.txt
          gh release upload "$tag" checksums.txt --clobber
