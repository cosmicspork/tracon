version: 2
updates:
  # The workflows pin every action to a commit SHA, so nothing moves unless
  # this does it. One grouped PR a month.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  # The headless-shell the browser bundle is built from, weekly and on its
  # own: Chrome ships security fixes too often for the monthly batch.
  # `browser.yml` smoke-tests each bump's bundle; the next release attaches it.
  - package-ecosystem: docker
    directory: /containers/browser
    schedule:
      interval: weekly
    commit-message:
      prefix: build

  # The sandbox base image's Ubuntu digest, monthly. The apt snapshot date and
  # the toolchain pins beside it move by hand; `sandbox-base.yml` builds and
  # smoke-tests either kind of change on both architectures. Only the 24.04
  # digest moves here: a new release changes the snapshot suite, the PPA and
  # every repo image built on it, so that is a deliberate change by hand.
  - package-ecosystem: docker
    directory: /containers/sandbox-base
    schedule:
      interval: monthly
    commit-message:
      prefix: build
    ignore:
      - dependency-name: "*ubuntu"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
