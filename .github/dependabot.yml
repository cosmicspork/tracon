version: 2
updates:
  # The workflows pin every action to a commit SHA, so nothing moves unless
  # this does it. One grouped PR a month.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  # The browser service's base image, weekly and on its own: Chrome ships
  # security fixes too often for the monthly batch. `browser.yml` smoke-tests
  # each bump; merging it publishes the image.
  - package-ecosystem: docker
    directory: /containers/browser
    schedule:
      interval: weekly
    commit-message:
      prefix: build
